name: documenter

on:
  push:
    tags: [ 'v[1-9]+.*' ]
  workflow_dispatch:

jobs:

  # TEMPORARY diagnostics for the 1.62.1 pipx/uv install failure (runs
  # 38595752831 * 2). Remove once the installer fault is isolated.
  diagnose-install:
    runs-on: ubuntu-latest
    steps:
      - name: Log installer versions
        run: |
          pipx --version
          uv --version
          python3 --version
      - name: Try direct uv tool install
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user uv
          export PATH="${HOME}/.local/bin:${PATH}"
          uv --version
          uv tool install 'emcd-projects==1.62.1' --verbose 2>&1 | tail -30

  docsgen:
    permissions:
      contents: write
      id-token: write
      pages: write
    uses: emcd/python-project-common/.github/workflows/xrepo--documenter.yaml@gha-1
    with:
      include-reports: false
      python-version: '3.12'
      emcd-projects-version: '1.62.1'
